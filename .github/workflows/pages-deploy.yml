name: GitHub Pages Deploy and Metrics

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        shell: bash
        run: |
          set -euo pipefail
          SITE_DIR="${RUNNER_TEMP}/pages-site"
          mkdir -p "$SITE_DIR"
          cp index.html "$SITE_DIR/"
          # Preserve the existing public dashboard and report URLs.
          for file in dashboard.html metrics.json weekly-report.md; do
            if [ -f "$file" ]; then
              cp "$file" "$SITE_DIR/"
            fi
          done
          if [ -d docs ]; then
            cp -R docs "$SITE_DIR/docs"
          fi
          echo "Pages artifact files:"
          find "$SITE_DIR" -type f -print
          du -sh "$SITE_DIR"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  collect-metrics:
    name: Collect metrics after deployment
    needs: deploy
    permissions:
      contents: read
      deployments: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate DORA metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python metrics.py

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dora-metrics
          path: |
            metrics.json
            weekly-report.md
            dashboard.html
          if-no-files-found: warn
