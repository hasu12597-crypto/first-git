name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  changes:
    name: Detect deploy-related changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deploy:
              - 'metrics.py'
              - 'index.html'
              - 'dashboard.html'
              - 'weekly-report.md'
              - 'docs/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/requirements-ci.txt'

  build:
    name: Build project artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build source artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          files = [Path('metrics.py'), Path('dashboard.html'), Path('index.html'), Path('weekly-report.md')]
          files.extend(sorted(Path('tests').glob('*.py')))
          missing = [str(path) for path in files if not path.is_file()]
          if missing:
              raise SystemExit(f'Missing build files: {missing}')
          with ZipFile('devflow-build.zip', 'w', ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.as_posix())
          print(f'Built {len(files)} files into devflow-build.zip')
          PY
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devflow-build
          path: devflow-build.zip

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}

  deploy:
    name: Publish verified CI artifact
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: devflow-build
          path: build-artifact
      - name: Publish verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: devflow-verified-build
          path: build-artifact/devflow-build.zip
