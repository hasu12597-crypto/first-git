<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DORA Demo Web App</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #2563eb;
        --text: #1f2937;
        --muted: #6b7280;
        --success: #15803d;
      }
      body {
        margin: 0;
        background: var(--bg);
        font-family: Arial, sans-serif;
        color: var(--text);
      }
      .container {
        max-width: 760px;
        margin: 80px auto;
        background: var(--panel);
        border-radius: 16px;
        box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
        padding: 40px 28px;
      }
      .badge {
        display: inline-block;
        background: rgba(37, 99, 235, 0.1);
        color: var(--primary);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      h1 {
        margin-top: 18px;
        font-size: 2.2rem;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
      }
      .status {
        margin-top: 20px;
        display: inline-block;
        background: rgba(21, 128, 61, 0.1);
        color: var(--success);
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="badge">GitHub Pages</div>
      <h1>DORA Demo Site</h1>
      <p>
        이 정적 웹사이트는 GitHub Pages에 실제 배포되고, 배포 성공 시점이 DORA 지표 수집에 기록됩니다.
      </p>
      <p>
        배포를 트리거할 때마다 현재 커밋 SHA와 배포 시각이 저장되어 Lead Time, Deployment Frequency, MTTR,
        Change Failure Rate를 계산하는 기반 데이터가 됩니다.
      </p>
      <div class="status">Production deployment ready</div>
    </main>
  </body>
</html>
